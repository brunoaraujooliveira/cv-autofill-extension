<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture 01 — plain HTML form</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 640px;
        margin: 24px auto;
      }
      label,
      fieldset {
        display: block;
        margin: 12px 0 4px;
      }
      .offscreen {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Apply: Senior Engineer</h1>
    <form id="application">
      <label for="first">First name *</label>
      <input id="first" name="firstName" required />

      <label for="last">Last name *</label>
      <input id="last" name="lastName" required />

      <label>Email <input name="email" type="email" required /></label>

      <div>
        <div>Phone</div>
        <input name="phone" type="tel" />
      </div>

      <input name="linkedin" aria-label="LinkedIn profile" />

      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="">Select…</option>
        <option value="BR">Brazil</option>
        <option value="PT">Portugal</option>
        <option value="ES">Spain</option>
      </select>

      <label for="start">Earliest start date</label>
      <input id="start" name="startDate" type="date" />

      <fieldset>
        <legend>Are you authorized to work in the EU? *</legend>
        <label><input type="radio" name="euAuthorized" value="yes" required /> Yes</label>
        <label><input type="radio" name="euAuthorized" value="no" /> No</label>
      </fieldset>

      <label for="salary">Salary expectation (EUR/year) *</label>
      <input id="salary" name="salary" type="number" required />

      <label for="why">Why do you want to work here?</label>
      <textarea id="why" name="why" rows="4"></textarea>

      <label><input type="checkbox" name="privacy" required /> I agree to the privacy policy</label>

      <div class="offscreen">
        <label for="trap">Leave this empty</label>
        <input id="trap" name="trap" />
      </div>
      <input type="hidden" name="csrf" value="token-123" />

      <p><button type="submit">Submit application</button></p>
    </form>
    <pre id="result"></pre>

    <script type="module">
      const form = document.querySelector('#application');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        document.querySelector('#result').textContent = JSON.stringify(data);
      });
    </script>
  </body>
</html>
